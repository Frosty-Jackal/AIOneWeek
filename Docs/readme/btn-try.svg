<svg xmlns="http://www.w3.org/2000/svg" width="720" height="120" viewBox="0 0 720 120" role="img" aria-label="立即体验 AIOneWeek.tech">
  <defs>
    <linearGradient id="pill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#E9CE72"/>
      <stop offset="0.38" stop-color="#C9A227"/>
      <stop offset="0.72" stop-color="#A67C00"/>
      <stop offset="1"    stop-color="#7C5C12"/>
    </linearGradient>

    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1"   stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5"  stop-color="#FFFDF0" stop-opacity="0.75"/>
      <stop offset="1"    stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-25%" y="-60%" width="150%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feColorMatrix in="b" type="matrix"
        values="0 0 0 0 0.85  0 0 0 0 0.69  0 0 0 0 0.22  0 0 0 0.55 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="pillClip">
      <rect x="20" y="20" width="680" height="80" rx="40"/>
    </clipPath>
  </defs>

  <g filter="url(#glow)">
    <rect x="20" y="20" width="680" height="80" rx="40" fill="url(#pill)"/>
  </g>

  <g clip-path="url(#pillClip)">
    <rect x="20" y="21" width="680" height="40" fill="url(#gloss)"/>
    <rect x="-160" y="20" width="150" height="80" fill="url(#sweep)" transform="skewX(-18)">
      <animateTransform attributeName="transform" type="translate"
                        values="0 0; 1000 0" dur="3.6s" repeatCount="indefinite" additive="sum"/>
    </rect>
  </g>

  <rect x="20" y="20" width="680" height="80" rx="40" fill="none"
        stroke="#6B4E0E" stroke-opacity="0.55" stroke-width="1.5"/>
  <rect x="21.5" y="21.5" width="677" height="77" rx="38.5" fill="none"
        stroke="#FFF6D5" stroke-opacity="0.5" stroke-width="1"/>

  <text x="360" y="61" text-anchor="middle" dominant-baseline="central"
        font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC','Hiragino Sans GB',sans-serif"
        font-size="33" font-weight="700" letter-spacing="1.5"
        fill="#5A4008" fill-opacity="0.55">立即体验 AIOneWeek.tech</text>
  <text x="360" y="60" text-anchor="middle" dominant-baseline="central"
        font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC','Hiragino Sans GB',sans-serif"
        font-size="33" font-weight="700" letter-spacing="1.5" fill="#FFFFFF">立即体验 AIOneWeek.tech</text>
</svg>
